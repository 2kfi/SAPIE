name: build

on:
  push:
    tags: ['0.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  proto-sync:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Proto copies in sync
        run: bash tools/check-proto-sync.sh

  client:
    needs: ci
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86, windows-x64, linux-x86, linux-x64, linux-arm64]
        era: [legacy, modern]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: pacman -Syu --noconfirm cmake ninja git go python protobuf mingw-w64-gcc aarch64-linux-gnu-gcc lib32-glibc lib32-gcc-libs
      - name: Protobuf for target
        run: bash tools/build-protobuf.sh ${{ matrix.target }}
      - name: Configure and build
        run: |
          cmake -S client -B build/${{ matrix.target }}-${{ matrix.era }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/client/cmake/toolchains/${{ matrix.target }}.cmake" \
            -DSAPIE_INTERFACE_ERA=${{ matrix.era }} \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/out/${{ matrix.target }}-${{ matrix.era }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.target }}-${{ matrix.era }} --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.target }}-${{ matrix.era }}
          path: out/${{ matrix.target }}-${{ matrix.era }}
          if-no-files-found: error

  server:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Test
        run: cd server && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: cd server && go build -o ../out/server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sapie-server
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/server-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  web:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" web/package.json
          echo "stamped $ver"
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  launcher-windows-qt:
    needs: ci
    runs-on: windows-latest
    env:
      SAPIE_SIGNING_THUMBPRINT: ${{ secrets.SAPIE_SIGNING_THUMBPRINT }}
      SAPIE_UPDATE_PUBLIC_KEY: ${{ secrets.SAPIE_UPDATE_PUBLIC_KEY }}
      SAPIE_UPDATE_SIGNING_KEY: ${{ secrets.SAPIE_UPDATE_SIGNING_KEY }}
      SAPIE_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8 MSVC
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
      - name: Install packaging tools
        run: choco install nsis wixtoolset imagemagick --no-progress -y
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Configure and build Qt launcher
        run: |
          set -euo pipefail
          cmake -S launcher -B build/windows-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSAPIE_VERSION="$VERSION" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/windows-qt --parallel
      - name: Qt launcher tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/windows-qt --output-on-failure
      - name: Resolve update public key
        run: |
          set -euo pipefail
          mkdir -p out/windows-package
          if [[ -z "${SAPIE_UPDATE_PUBLIC_KEY:-}" ]]; then
            cp tools/update-signing-public.pem out/windows-package/public.pem
          elif [[ "$SAPIE_UPDATE_PUBLIC_KEY" == *"BEGIN PUBLIC KEY"* ]]; then
            printf '%s\n' "$SAPIE_UPDATE_PUBLIC_KEY" > out/windows-package/public.pem
          else
            cp "$SAPIE_UPDATE_PUBLIC_KEY" out/windows-package/public.pem
          fi
          echo "PUBLIC_KEY_PATH=$PWD/out/windows-package/public.pem" >> "$GITHUB_ENV"
      - name: Package Windows launcher
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File launcher/windows/packaging/build-package.ps1 \
            -Version "$VERSION" \
            -QtBin "$QT_ROOT_DIR/bin" \
            -Exe "$PWD/build/windows-qt/sapie_launcher.exe" \
            -RepoRoot "$PWD" \
            -OutputDir "$PWD/out/windows-package" \
            -Channel stable \
            -UpdatePublicKey "$PUBLIC_KEY_PATH"
      - name: Windows SBOM
        run: python tools/gen-sbom.py --tag "$VERSION" --output-dir out/windows-package --repo "$PWD"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-windows-x64
          path: out/windows-package/work/stage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows-qt
          path: |
            out/windows-package/SAPIE-*.exe
            out/windows-package/SAPIE-*.msi
            out/windows-package/SAPIE-*.zip
            out/windows-package/SHA256SUMS.txt
            out/windows-package/SBOM-*.json
            out/windows-package/update-*.json
            out/windows-package/update-*.sig
            out/windows-package/public.pem
          if-no-files-found: error

  launcher-linux-qt:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64, qt_host: linux, qt_arch: linux_gcc_64 }
          - { os: ubuntu-24.04-arm, arch: arm64, qt_host: linux_arm64, qt_arch: linux_gcc_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.3'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libdbus-1-dev librsvg2-dev librsvg2-bin \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev dpkg-dev flatpak flatpak-builder ostree curl
      - name: Install AppImage tools
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) suffix=x86_64 ;;
            arm64) suffix=aarch64 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${suffix}.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${suffix}.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy-plugin-qt" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${suffix}.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy" "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          echo "QMAKE=$QT_ROOT_DIR/bin/qmake6" >> "$GITHUB_ENV"
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Configure and build Qt launcher
        run: |
          set -euo pipefail
          cmake -S launcher -B "build/linux-qt-${{ matrix.arch }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSAPIE_VERSION="$VERSION" \
            -DSAPIE_ARCH="${{ matrix.arch }}" \
            -DSAPIE_FLATPAK_REPO="$PWD/flatpak-repo" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "build/linux-qt-${{ matrix.arch }}" --parallel
          cmake --build "build/linux-qt-${{ matrix.arch }}" --target sapie-linux-icons
          mkdir -p flatpak-repo
          ostree --repo=flatpak-repo init --mode=archive-z2
      - name: Qt launcher tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir "build/linux-qt-${{ matrix.arch }}" --output-on-failure
      - name: Package Linux launcher
        run: |
          set -euo pipefail
          bash launcher/linux/packaging/build-package.sh \
            "$PWD/build/linux-qt-${{ matrix.arch }}/sapie_launcher" \
            "$PWD" \
            "$PWD/build/linux-qt-${{ matrix.arch }}/linux/resources" \
            "$PWD/build/linux-qt-${{ matrix.arch }}/linux/hicolor" \
            "$PWD/out/linux-package-${{ matrix.arch }}" \
            "${{ matrix.arch }}" "$VERSION" "$PWD/flatpak-repo"
      - name: Checksums and SBOM
        run: |
          set -euo pipefail
          out="out/linux-package-${{ matrix.arch }}"
          (cd "$out" && find . -type f -name 'SAPIE-*' -printf '%P\n' | LC_ALL=C sort |
            while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS.txt)
          python3 tools/gen-sbom.py --tag "$VERSION" --output-dir "$out" --repo "$PWD"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-linux-${{ matrix.arch }}
          path: out/linux-package-${{ matrix.arch }}/appimage
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux-qt-${{ matrix.arch }}
          path: |
            out/linux-package-${{ matrix.arch }}/appimage/*.AppImage
            out/linux-package-${{ matrix.arch }}/deb/*.deb
            out/linux-package-${{ matrix.arch }}/flatpak/*.flatpak
            out/linux-package-${{ matrix.arch }}/SHA256SUMS.txt
            out/linux-package-${{ matrix.arch }}/SBOM-*.json
          if-no-files-found: error

  release:
    needs: [proto-sync, client, server, web, launcher-windows-qt, launcher-linux-qt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '{client,launcher,server,web}-*'
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
      - name: Build release bundles
        env:
          TAG: ${{ github.ref_name }}
          SAPIE_UPDATE_SIGNING_KEY: ${{ secrets.SAPIE_UPDATE_SIGNING_KEY }}
        run: bash tools/release-bundle.sh "$TAG" release-artifacts release-dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' \) -print)
          ((${#installers[@]} > 0)) || { echo "no launcher installers found" >&2; exit 1; }
          gh release create "$TAG" release-dist/* "${installers[@]}" --generate-notes --title "$TAG"

  docker:
    needs: [proto-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/2kfi/sapie-server:${{ github.ref_name }}
            ghcr.io/2kfi/sapie-server:latest
