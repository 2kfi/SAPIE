name: build

on:
  push:
    tags: ['0.*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Proto copies in sync
        run: bash tools/check-proto-sync.sh

  client:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86, windows-x64, linux-x86, linux-x64, linux-arm64]
        era: [legacy, modern]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: pacman -Syu --noconfirm cmake ninja git go python protobuf mingw-w64-gcc aarch64-linux-gnu-gcc lib32-glibc lib32-gcc-libs
      - name: Protobuf for target
        run: bash tools/build-protobuf.sh ${{ matrix.target }}
      - name: Configure and build
        run: |
          cmake -S client -B build/${{ matrix.target }}-${{ matrix.era }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/client/cmake/toolchains/${{ matrix.target }}.cmake" \
            -DSAPIE_INTERFACE_ERA=${{ matrix.era }} \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/out/${{ matrix.target }}-${{ matrix.era }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.target }}-${{ matrix.era }} --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.target }}-${{ matrix.era }}
          path: out/${{ matrix.target }}-${{ matrix.era }}
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Test
        run: cd server && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: cd server && go build -o ../out/server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sapie-server
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/server-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          sed -i "s/^version = .*/version = \"$ver\"/" client/src-tauri/Cargo.toml
          for f in client/src-tauri/tauri.conf.json client/src-tauri/ui/package.json web/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" "$f"
          done
          echo "stamped $ver"
      - name: Native launcher build
        run: cd client/src-tauri && cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.target }}
          path: client/src-tauri/target/${{ matrix.target }}/release/sapie*
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          sed -i "s/^version = .*/version = \"$ver\"/" client/src-tauri/Cargo.toml
          for f in client/src-tauri/tauri.conf.json client/src-tauri/ui/package.json web/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" "$f"
          done
          echo "stamped $ver"
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  launcher-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          sed -i "s/^version = .*/version = \"$ver\"/" client/src-tauri/Cargo.toml
          for f in client/src-tauri/tauri.conf.json client/src-tauri/ui/package.json web/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" "$f"
          done
          echo "stamped $ver"
      - name: Install launcher UI dependencies
        run: npm --prefix client/src-tauri/ui ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS and MSI installers
        run: cd client/src-tauri && cargo tauri build --bundles nsis,msi --config '{"build":{"beforeBuildCommand":"npm --prefix ui run build"}}'
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  launcher-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Stamp version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "not a numeric release tag: $TAG" >&2; exit 1; }
          ver="$TAG"
          [[ "$ver" == *.*.* ]] || ver="$ver.0"
          sed -i "s/^version = .*/version = \"$ver\"/" client/src-tauri/Cargo.toml
          for f in client/src-tauri/tauri.conf.json client/src-tauri/ui/package.json web/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" "$f"
          done
          echo "stamped $ver"
      - name: Install launcher UI dependencies
        run: npm --prefix client/src-tauri/ui ci
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build AppImage
        run: cd client/src-tauri && cargo tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":"npm --prefix ui run build"}}'
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux
          path: client/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [proto-sync, client, server, launcher, web, launcher-windows, launcher-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '{client,launcher,server,web}-*'
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
      - name: Build release bundles
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/release-bundle.sh "$TAG" release-artifacts release-dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t installers < <(find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' \) -print)
          ((${#installers[@]} > 0)) || { echo "no launcher installers found" >&2; exit 1; }
          gh release create "$TAG" release-dist/* "${installers[@]}" --generate-notes --title "$TAG"

  docker:
    needs: [proto-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/2kfi/sapie-server:${{ github.ref_name }}
            ghcr.io/2kfi/sapie-server:latest
