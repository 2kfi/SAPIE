# CI and release workflows
name: build

on:
  push:
    branches: ['*-client', '*-server']
    tags: ['*']
  pull_request:
    branches: ['dev-client', 'main-client', 'dev-server', 'main-server']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Proto copies in sync
        run: bash tools/check-proto-sync.sh

  client:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86, windows-x64, linux-x86, linux-x64, linux-arm64]
        era: [legacy, modern]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: pacman -Syu --noconfirm cmake ninja git go python protobuf mingw-w64-gcc aarch64-linux-gnu-gcc lib32-glibc lib32-gcc-libs
      - name: Protobuf for target
        run: bash tools/build-protobuf.sh ${{ matrix.target }}
      - name: Configure and build
        run: |
          cmake -S client -B build/${{ matrix.target }}-${{ matrix.era }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/client/cmake/toolchains/${{ matrix.target }}.cmake" \
            -DSAPIE_INTERFACE_ERA=${{ matrix.era }} \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/out/${{ matrix.target }}-${{ matrix.era }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.target }}-${{ matrix.era }} --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.target }}-${{ matrix.era }}
          path: out/${{ matrix.target }}-${{ matrix.era }}

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test
        run: cd server && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: cd server && go build -o ../out/server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sapie-server
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/server-${{ matrix.goos }}-${{ matrix.goarch }}

  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Native launcher build
        run: cd client/src-tauri && cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: client/src-tauri/target/${{ matrix.target }}/release/sapie*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [proto-sync, client, server, launcher, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '{client,launcher,server,web}-*'
      - name: Build release bundles
        run: bash tools/release-bundle.sh "${{ github.ref_name }}" release-artifacts release-dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" release-dist/* --generate-notes --title "SAPIE ${{ github.ref_name }}"

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [proto-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/2kfi/sapie-server:${{ github.ref_name }}
            ghcr.io/2kfi/sapie-server:latest
