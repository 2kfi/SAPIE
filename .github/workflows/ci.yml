name: ci

on:
  push:
    branches: ['dev-client']
  pull_request:
    branches: ['dev-client', 'main-client']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Proto copies in sync
        run: bash tools/check-proto-sync.sh

  no-tracked-build-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked build products
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r file; do
            case "$file" in
              client/src-tauri/resources/steamless/*) continue ;;
            esac
            if printf '%s\n' "$file" | grep -Eiq '\.(dll|so|dylib|exe|a|lib|o|obj|pdb)$'; then
              echo "ERROR: tracked build product: $file" >&2
              status=1
            fi
          done < <(git ls-files)
          while IFS= read -r file; do
            echo "ERROR: tracked path in generated directory: $file" >&2
            status=1
          done < <(git ls-files -- out/ build/ web/dist/ third_party/ client/src-tauri/target/)
          exit "$status"

  client:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x86, windows-x64, linux-x86, linux-x64, linux-arm64]
        era: [legacy, modern]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: pacman -Syu --noconfirm cmake ninja git go python protobuf mingw-w64-gcc aarch64-linux-gnu-gcc lib32-glibc lib32-gcc-libs
      - name: Protobuf for target
        run: bash tools/build-protobuf.sh ${{ matrix.target }}
      - name: Configure and build
        run: |
          cmake -S client -B build/${{ matrix.target }}-${{ matrix.era }} -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/client/cmake/toolchains/${{ matrix.target }}.cmake" \
            -DSAPIE_INTERFACE_ERA=${{ matrix.era }} \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/out/${{ matrix.target }}-${{ matrix.era }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.target }}-${{ matrix.era }} --parallel

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Vet
        run: cd server && go vet ./...
      - name: Test
        run: cd server && go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: cd server && go build -o ../out/server-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/sapie-server

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native launcher dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - name: Cargo check
        run: cd launcher && cargo check
      - name: Cargo test
        run: cd launcher && cargo test
      - name: Rust formatting
        run: cd launcher && cargo fmt --check
      - name: Cargo clippy
        run: cd launcher && cargo clippy --all-targets -- -D warnings

  launcher-qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libdbus-1-dev librsvg2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev
      - name: Configure and build Qt launcher
        run: |
          cmake -S launcher -B build/qt-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/qt-ci --parallel
      - name: Qt launcher tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/qt-ci --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Web UI tests
        run: cd web && npm test

  dependency-audits:
    runs-on: ubuntu-latest
    env:
      # Accepted only because the fix is a major vitest bump in both UI packages.
      # Each advisory is named in docs/SECURITY.md. Any new advisory fails the job.
      ACCEPTED_NPM_ADVISORIES: >-
        GHSA-4w7w-66w2-5vf9 GHSA-v6wh-96g9-6wx3 GHSA-698v-4r3x-3vcv
        GHSA-r825-w8mm-5pxw GHSA-587h-7wmj-h5pm GHSA-9jrq-w75r-8gcw
        GHSA-rq7h-c2jc-7f22 GHSA-fx2h-pf6j-xcff GHSA-5gmw-xhrv-c9v3
        GHSA-85c8-ppgw-ccpr GHSA-5xrq-8626-4rwp GHSA-82fw-gwwq-j7x9
        GHSA-qxg6-89mg-rqv8 GHSA-67mh-4wv8-2f99
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan
        run: python3 tools/scan-secrets.py
      - name: Dependency policy allowlist
        run: python3 tools/check-dependency-policy.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cargo install cargo-audit --locked
      - name: Go vulnerabilities
        run: cd server && govulncheck ./...
      - name: Cargo vulnerabilities
        run: cd launcher && cargo audit
      - name: npm vulnerabilities
        run: |
          set -euo pipefail
          for dir in web; do
            echo "== npm audit: $dir =="
            (
              cd "$dir"
              npm ci --ignore-scripts
              npm audit --json > audit.json || true
              ACCEPTED_NPM_ADVISORIES="$ACCEPTED_NPM_ADVISORIES" python3 -c '
          import json, os, sys
          accepted = set(os.environ["ACCEPTED_NPM_ADVISORIES"].split())
          data = json.load(open("audit.json"))
          seen = set()
          for name, vuln in data.get("vulnerabilities", {}).items():
              for via in vuln.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  gid = via.get("url", "").rsplit("/", 1)[-1]
                  if not gid.startswith("GHSA-"):
                      continue
                  seen.add(gid)
                  state = "accepted" if gid in accepted else "NEW"
                  print("%s %s (%s) via %s" % (state, gid, via.get("severity", ""), name))
          new = sorted(seen - accepted)
          if new:
              print("Unaccepted advisories: " + ", ".join(new), file=sys.stderr)
              sys.exit(1)
          print("No unaccepted advisories")
          '
            )
            rm -f "$dir/audit.json"
          done
