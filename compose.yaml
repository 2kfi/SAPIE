services:
  sapie-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/2kfi/sapie-server:latest
    ports:
      - "47584:47584"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    command: ["--admin-listen=:8080", "--ui-listen=0.0.0.0:8081", "--ui-dir=/app/web/dist"]
    volumes:
      - sapie-data:/data
    restart: unless-stopped

volumes:
  sapie-data:
