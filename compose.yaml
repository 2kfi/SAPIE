services:
  sapie-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/2kfi/sapie-server:latest
    ports:
      - "47584:47584"
      - "127.0.0.1:8080:8080"
    command: ["--admin-listen=:8080"]
    volumes:
      - sapie-data:/data
    restart: unless-stopped

volumes:
  sapie-data:
