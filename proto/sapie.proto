syntax = "proto3";

package sapie;

import "net.proto";

option go_package = "github.com/sapie/sapie/server/internal/protocol;protocol";
option optimize_for = LITE_RUNTIME;

message FriendSnapshot {
  uint64 steam_id = 1;
  bytes persona_name = 2;
  uint32 appid = 3;
  uint64 lobby_id = 4;
  map<string, bytes> rich_presence = 5;
}

// Addresses are raw bytes in network byte order (4 for IPv4, 16 for IPv6).
// Ports are host order. Zero port means the family is unavailable.
message EndpointReport {
  bytes ipv4 = 1;
  uint32 ipv4_port = 2;
  bytes ipv6 = 3;
  uint32 ipv6_port = 4;
}

message EndpointSignal {
  uint64 steam_id = 1; // server-stamped from the authenticated connection
  EndpointReport endpoints = 2;
}

message LobbyMetadataFilter {
  enum Comparison {
    EQUAL = 0;
    NOT_EQUAL = 1;
    GREATER = 2;
    GREATER_EQUAL = 3;
    LESS = 4;
    LESS_EQUAL = 5;
  }
  string key = 1;
  oneof match_value {
    string string_value = 2;
    int64 numeric_value = 3;
  }
  Comparison comparison = 4;
}

message LobbyListRequest {
  uint64 request_id = 1;
  uint32 appid = 2;
  repeated LobbyMetadataFilter filters = 3;
  uint32 min_members = 4;
  uint32 max_members = 5; // 0 means no upper bound
  bool joinable = 6;
}

message LobbyListResponse {
  uint64 request_id = 1;
  repeated uint64 lobby_ids = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  uint32 appid = 3;
  string client_version = 4;
  string session_token = 5;
  EndpointReport endpoints = 6;
}

message LoginResponse {
  enum Status {
    OK = 0;
    BAD_CREDENTIALS = 1;
    BANNED = 2;
    SERVER_FULL = 3;
    VERSION_MISMATCH = 4;
    RATE_LIMITED = 5;
  }
  Status status = 1;
  uint64 steam_id = 2;
  bytes persona_name = 3;
  bytes session_token = 4;
  repeated FriendSnapshot friends = 5;
}

message TicketRequest {
  uint32 appid = 1;
  bytes data = 2;
}

message TicketResponse {
  bytes ticket = 1;
  uint32 number = 2;
}

message StatValue {
  string name = 1;
  bytes value = 2;
}

message AchievementState {
  string name = 1;
  bool achieved = 2;
  uint32 unlock_time = 3;
  int64 unlock_time_unix = 4;
}

message StatsGet {
  uint32 appid = 1;
  repeated string names = 2;
  uint64 steam_id = 3;
}

message StatsSet {
  uint32 appid = 1;
  repeated StatValue stats = 2;
  repeated AchievementState achievements = 3;
}

message StatsResponse {
  repeated StatValue stats = 1;
  repeated AchievementState achievements = 2;
  uint64 steam_id = 3;
}

message ContentServerRequest {
  uint32 appid = 1;
}

message ContentServerResponse {
  bool ok = 1;
}

message Frame {
  oneof payload {
    LoginRequest login = 1;
    LoginResponse login_response = 2;
    Common_Message steam = 3;
    TicketRequest ticket_request = 4;
    TicketResponse ticket_response = 5;
    StatsGet stats_get = 6;
    StatsSet stats_set = 7;
    StatsResponse stats_response = 8;
    bool ping = 9;
    bool pong = 10;
    AchievementUnlock achievement_unlock = 11;
    ContentServerRequest content_server_request = 12;
    ContentServerResponse content_server_response = 13;
    EndpointReport endpoint_report = 14;
    EndpointSignal endpoint_signal = 15;
    LobbyListRequest lobby_list_request = 16;
    LobbyListResponse lobby_list_response = 17;
  }
}
