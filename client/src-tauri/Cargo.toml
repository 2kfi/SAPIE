[package]
name = "sapie-launcher"
version = "0.1.0"
description = "SAPIE native launcher"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
dirs = "6"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
