[package]
name = "sapie-launcher"
version = "0.1.0"
description = "SAPIE native launcher"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "sync-secret-service",
  "crypto-rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
